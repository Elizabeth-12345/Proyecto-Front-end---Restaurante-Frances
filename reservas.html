    <meta charset="UTF-8">

    <link

        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="estilos.css">
</head>
<body>
<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-cream fixed-top">
    <div class="container">
        <a class="navbar-brand brand"
            href="index.html">
            RESTAURANTE<br>
            FRANCÉS
        </a>
        <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse"
            id="nav">
            <ul class="navbar-nav ms-auto
                    align-items-lg-center
                    gap-lg-3">
                <li>
                    <a class="nav-link"
                    href="index.html">
                        Inicio
                    </a>
                </li>
                <li>
                    <a class="nav-link"
                    href="menu.html">
                        Menú
                    </a>
                </li>
                <li>
                    <a class="nav-link"
                    href="contacto.html">
                        Contacto
                    </a>
                </li>
                <li>
                    <a class="btn btn-dark rounded-pill px-4"
                    href="reservas.html">
                        Reservar
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<!-- RESERVA -->
<main class="form-page bg-cream">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="form-card">
                    <p class="eyebrow">
                        UNA MESA EN PARÍS
                    </p>
                    <h1 class="display-font">
                        Haz tu reserva
                    </h1>
                    <p class="text-secondary">
                        Completa el formulario y nos
                        pondremos en contacto contigo
                        para confirmar.
                    </p>
                    <form id="reservationForm"
                        class="row g-3 mt-3"
                        novalidate>
                        <!-- NOMBRE -->
                        <div class="col-md-6">
                            <label class="form-label">
                                Nombre
                            </label>
                            <input
                                class="form-control"
                                name="nombre"
                                required>
                        </div>
                        <!-- TELEFONO -->
                        <div class="col-md-6">
                            <label class="form-label">
                                Teléfono
                            </label>
                            <input
                                class="form-control"
                                name="telefono"
                                type="tel"
                                required>
                        </div>
                        <!-- FECHA -->
                        <div class="col-md-6">
                            <label class="form-label">
                                Fecha
                            </label>
                            <input
                                class="form-control"
                                name="fecha"
                                type="date"
                                required>
                        </div>
                        <!-- HORA -->
                        <div class="col-md-3">
                            <label class="form-label">
                                Hora
                            </label>
                            <input
                                class="form-control"
                                name="hora"
                                type="time"
                                required>
                        </div>
                        <!-- PERSONAS -->
                        <div class="col-md-3">
                            <label class="form-label">
                                Personas
                            </label>
                            <select
                                class="form-select"
                                name="personas"
                                required>
                                <option value="">
                                    —
                                </option>
                                <option>
                                    1
                                </option>
                                <option>
                                    2
                                </option>
                                <option>
                                    3
                                </option>
                                <option>
                                    4
                                </option>
                                <option>
                                    5
                                </option>
                                <option>
                                    6+
                                </option>
                            </select>
                        </div>
                        <!-- MENSAJE -->
                        <div class="col-12">
                            <label class="form-label">
                                Mensaje
                            </label>
                            <textarea
                                class="form-control"
                                name="mensaje"
                                rows="4"
                                placeholder="Alergias, ocasión especial, etc.">
                            </textarea>
                        </div>
                        <!-- BOTON -->
                        <div class="col-12">
                            <button
                                class="btn btn-dark rounded-pill px-5 py-3"
                                type="submit">
                                Solicitar reserva
                            </button>
                        </div>
                        <div id="reservationMessage"
                            class="col-12">
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
<script src="script.js"></script>
</body>
</html>
